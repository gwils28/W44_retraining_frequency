# Block 5 on real data: protocol written and committed BEFORE any result on this dataset.
# Question: does the freshness budget (max cadence at which the model still beats the seasonal naive) depend on
# the served quantile, and by how much, once the quantiles are calibrated?
version: 1
written: 2026-10-25
dataset:
  name: Monash Electricity Hourly
  url: https://zenodo.org/api/records/4656140/files/electricity_hourly_dataset.zip/content
  record: https://zenodo.org/records/4656140
  licence: CC-BY-4.0
  file: electricity_hourly_dataset.tsf
  sha256_zip: eff447075dde68dca0105ab7e2851c5637967ae3bb21556fd8b931f196d5968c
  series_expected: 321
  frequency: hourly
data_checks:                     # executed at every load; each failure says where and how many
  - all series have the same length and start
  - no missing values
  - no negative values
  - exclude a series if more than 10 % of its evaluation span is exactly zero (count reported)
span:
  evaluation_hours: 8760         # the last 365 days of the file
  history_before_evaluation: 552 # w + m + d = 312 for the first fit, plus 240 for the first conformal errors
model:                           # identical to the DGP study: window mean + daily profile
  window_w: 240
  season_m: 24
  horizon_h: 24
  closing_lag_d: 48
quantiles:
  taus: [0.50, 0.80, 0.95]
  methods:
    gaussian_insample: "mu + profile + z_tau * in-window residual std (the plan's method)"
    conformal_closed: "mu + profile + empirical tau-quantile of the model's own CLOSED errors, per series and horizon,
      last 240 closed origins, recomputed every 24 steps; gaussian until 48 closed origins exist"
cadences_k: [1, 24, 72, 168, 336, 720]
baselines:
  - seasonal_naive_24 with the plan's dispersion (std of lag-24 differences over the last 240 steps)
  - seasonal_naive_168 (same dispersion rule, lag 168), reported, not used for k_max
metrics:
  loss: pinball scaled per series by the mean |y_t - y_{t-24}| over the evaluation span, averaged over series
  coverage: share of targets below the tau quantile
  k_max: largest k in cadences_k whose scaled pinball is below seasonal_naive_24, per tau and method
  stability: jump p95 and share of origins with a revision above 1 % of the scale, at tau = 0.95
  closing_lag_illusion: k in [24, 168], tau = 0.95, fit_lag 48 vs 0
dispersion:
  split: the evaluation year in 4 consecutive quarters of 2190 hours; k_max and gains reported per quarter
decision_rule: >
  The plan's claim ("the freshness budget is a function of the served quantile, k_max(0.50) / k_max(0.95) = 7")
  is supported on this dataset if, with conformal quantiles, k_max(0.50) / k_max(0.95) >= 4 on the full year and
  in at least 3 quarters out of 4. It is contradicted if the ratio is <= 1 on the full year.
